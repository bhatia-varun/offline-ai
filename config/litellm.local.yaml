model_list:
  - model_name: general
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434

  # Reuse the small local model for both logical capabilities.
  - model_name: agent
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434

litellm_settings:
  drop_params: true
  request_timeout: 180
  set_verbose: false

general_settings:
  master_key: local-demo-key
